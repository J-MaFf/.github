name: PowerShell Lint (reusable)

# Reusable PowerShell static-lint job, shared across J-MaFf repos: parse-check
# every *.ps1/*.psm1, then PSScriptAnalyzer failing on Error severity only
# (warnings are reported but don't fail the build). Static analysis only — this
# job must NEVER execute repo scripts; several repos contain scripts that
# self-elevate, block on Read-Host, or permanently modify the runner.
#
# Runs on the self-hosted GH-RUNNER-FLAUI runner (Windows Server 2025, pwsh 7.6+).
# The PSScriptAnalyzer install persists there, so the guarded install is a
# no-op after the first run.

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Space-separated list of directories to lint, relative to the repo
          root. Directories that don't exist are skipped. Default: the whole
          repo.
        type: string
        required: false
        default: '.'

jobs:
  ps-lint:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Parse-check all PowerShell scripts
        env:
          LINT_PATHS: ${{ inputs.paths }}
        run: |
          $roots = @($env:LINT_PATHS -split '\s+' | Where-Object { $_ -and (Test-Path $_) })
          if (-not $roots) {
              Write-Host 'None of the configured paths exist; nothing to lint.'
              exit 0
          }
          $scripts = Get-ChildItem -Path $roots -Recurse -Include *.ps1, *.psm1 -File |
              Where-Object { $_.FullName -notmatch '[\\/]\.git([\\/]|$)' }
          if (-not $scripts) {
              Write-Host 'No PowerShell scripts found to parse-check.'
              exit 0
          }
          $failed = $false
          foreach ($script in $scripts) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $failed = $true
                  Write-Host "PARSE ERRORS: $($script.FullName)"
                  foreach ($e in $parseErrors) {
                      Write-Host ("  line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
                  }
              }
              else {
                  Write-Host "OK: $($script.FullName)"
              }
          }
          if ($failed) {
              throw 'One or more PowerShell scripts failed to parse.'
          }

      - name: Run PSScriptAnalyzer (fail on Error severity only)
        env:
          LINT_PATHS: ${{ inputs.paths }}
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Write-Host 'Installing PSScriptAnalyzer...'
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer
          $roots = @($env:LINT_PATHS -split '\s+' | Where-Object { $_ -and (Test-Path $_) })
          if (-not $roots) {
              Write-Host 'None of the configured paths exist; nothing to analyze.'
              exit 0
          }
          $results = @($roots | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse })
          if ($results.Count -gt 0) {
              $results |
                  Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 200 |
                  Write-Host
          }
          $errorFindings = @($results | Where-Object { $_.Severity -eq 'Error' })
          $warningFindings = @($results | Where-Object { $_.Severity -eq 'Warning' })
          Write-Host ("PSScriptAnalyzer: {0} error(s), {1} warning(s)." -f `
              $errorFindings.Count, $warningFindings.Count)
          if ($warningFindings.Count -gt 0) {
              Write-Host 'Warnings are reported above but do not fail the build.'
          }
          if ($errorFindings.Count -gt 0) {
              throw "PSScriptAnalyzer found $($errorFindings.Count) error-severity finding(s)."
          }
